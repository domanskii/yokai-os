<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YOKAI OS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111518;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(92%, 700px);
      padding: 48px;
      border: 1px solid #30363b;
      border-radius: 22px;
      background: #181d21;
      text-align: center;
    }
    h1 { font-size: clamp(42px, 9vw, 78px); margin: 0; }
    p { color: #aeb8bf; font-size: 18px; }
    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border: 1px solid #48525a;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <h1>YOKAI OS</h1>
    <p>Production Intelligence Platform</p>
    <div class="status">Foundation 0.1 działa</div>
  </main>
</body>
</html>
