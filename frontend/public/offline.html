<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>YOKAI OS — offline</title>
  <style>
    html,body{margin:0;min-height:100%;background:#080b10;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    section{width:min(440px,100%);border:1px solid rgba(255,255,255,.08);background:#0e131a;border-radius:28px;padding:28px;box-sizing:border-box}
    .eyebrow{font-size:11px;letter-spacing:.2em;color:#b99cff;font-weight:700}
    h1{font-size:26px;margin:12px 0 8px}
    p{color:rgba(255,255,255,.42);line-height:1.6;font-size:14px}
    button{margin-top:18px;width:100%;height:46px;border:0;border-radius:14px;background:#6d28d9;color:#fff;font-weight:700}
  </style>
</head>
<body>
<main>
  <section>
    <div class="eyebrow">YOKAI OS MOBILE</div>
    <h1>Brak połączenia</h1>
    <p>Dane biznesowe nie są zapisywane offline. Po odzyskaniu internetu wróć do aplikacji i odśwież widok.</p>
    <button onclick="location.reload()">Spróbuj ponownie</button>
  </section>
</main>
</body>
</html>
